<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Costura — Gestión de taller</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Sprite de iconos -->

    <symbol id="i-pants" viewBox="0 0 24 24"><path d="M8 3.5h8l1.6 6.5L16.4 21h-3l-1.1-9h-.6l-1.1 9h-3L5.4 10 8 3.5Z"/><path d="M8 7h8"/></symbol>
    <symbol id="i-dress" viewBox="0 0 24 24"><path d="M9.2 3.5 6.6 9l1.6 1.6L6 21h12l-2.2-10.4L17.4 9 14.8 3.5c-.7 1.2-1.6 1.8-2.8 1.8s-2.1-.6-2.8-1.8Z"/><path d="M9 9.4h6"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l1 12H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.2 2.7-5.2 6-5.2s6 2 6 5.2"/><path d="M16 5.2A3 3 0 0 1 18 11"/><path d="M17.5 14.4c2.1.6 3.5 2.3 3.5 4.6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r=".9" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8.5" rx="2"/><path d="M7 14.5h10V21H7z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9 6.5V4h6v2.5M6.5 6.5 7.5 21h9l1-14.5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="m14.5 5.5 4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5L20 7"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-10Z"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v7c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 22 20H2L12 3.5Z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6.5" r="2.5"/><circle cx="6" cy="17.5" r="2.5"/><path d="M8 8 20 18M8 16 20 6"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5" transform="rotate(-8 12 12)"/><path d="M7 8.7v2.6M10 8.2v3.4M13 7.8v2.6M16 7.3v3.4M19 6.9v2.6"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3.5 8.5A2.5 2.5 0 0 1 6 6h13.5v12H6a2.5 2.5 0 0 1-2.5-2.5v-7Z"/><path d="M3.5 9.5h17"/><circle cx="16.5" cy="14" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 1 0-2.4 6.3"/><path d="M20 5v6.5h-6.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><polyline points="21 15 16 10 5 21" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  </svg>

  <!-- Vista dedicada de Inicio de Sesión / Registro (LoginView) protegida por el backend en Rust -->
  <section id="loginView" class="login-view" aria-label="Inicio de sesión del taller">
    <div class="login-card">
      <div class="login-head">
        <div class="login-brand">
          <div class="brand-mark">C</div>
          <div>
            <h1 class="login-title">Costura</h1>
            <p class="login-sub">Gestión de taller · Control de acceso</p>
          </div>
        </div>
        <button class="icon-btn" id="loginThemeToggle" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <svg id="loginThemeIcon"><use href="#i-moon"/></svg>
        </button>
      </div>

      <div class="login-tabs" role="tablist" aria-label="Modo de acceso">
        <button class="login-tab is-active" id="tabLoginMode" type="button" data-action="login-switch-mode" data-mode="login" role="tab" aria-selected="true">
          Iniciar sesión
        </button>
        <button class="login-tab" id="tabRegisterMode" type="button" data-action="login-switch-mode" data-mode="register" role="tab" aria-selected="false">
          Crear cuenta
        </button>
      </div>

      <div id="loginAlertBox" class="login-alert" hidden role="alert"></div>

      <form id="loginViewForm" data-form="login-view-auth" data-mode="login" class="login-form" autocomplete="off">
        <div class="field">
          <label class="label" for="loginEmail">Correo electrónico del taller</label>
          <input class="input" id="loginEmail" name="email" type="email" required placeholder="taller@ejemplo.com" autocomplete="username" />
        </div>
        <div class="field">
          <div class="login-label-row">
            <label class="label" for="loginPassword">Contraseña</label>
            <button class="card-link" id="btnForgotPassword" type="button" data-action="login-forgot-password">
              ¿Olvidaste tu contraseña?
            </button>
          </div>
          <input class="input" id="loginPassword" name="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-block" id="loginSubmitBtn" type="submit">
          <svg><use href="#i-lock"/></svg>
          <span id="loginSubmitLabel">Iniciar sesión</span>
        </button>
      </form>

      <div class="login-divider"><span>o</span></div>

      <button class="btn btn-block login-google-btn" id="btnGoogleAuth" type="button" data-action="login-with-google">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:none;fill:currentColor">
          <path d="M21.35 11.1h-9.18v2.73h5.51c-.24 1.48-1.6 4.34-5.51 4.34-3.31 0-6.02-2.74-6.02-6.12s2.71-6.12 6.02-6.12c1.89 0 3.16.8 3.88 1.49l2.64-2.54C17.01 3.3 14.84 2.4 12.17 2.4 6.84 2.4 2.53 6.7 2.53 12.05s4.31 9.65 9.64 9.65c5.56 0 9.25-3.91 9.25-9.42 0-.63-.07-1.11-.17-1.58Z"/>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <div class="login-foot">
        <button class="login-offline-btn" id="btnOfflineLocal" type="button" data-action="login-offline-local">
          Continuar en modo local sin conexión
        </button>
        <p class="login-hint" id="loginKeyringHint">
          Sesión custodiada en el Administrador de Credenciales del sistema (<span class="mono">JLRDev.TallerCostura</span>).
        </p>
      </div>
    </div>
  </section>

  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div class="brand-text">
          <div class="brand-name" id="brandName">Costura</div>
          <div class="brand-sub" id="brandSub">Gestión de taller</div>
        </div>
      </div>

      <nav class="nav" aria-label="Secciones">
        <button class="nav-item is-active" data-view="inicio" type="button">
          <span class="nav-icon"><svg><use href="#i-home"/></svg></span><span data-i18n="nav.home">Inicio</span>
        </button>
        <button class="nav-item" data-view="pedidos" type="button">
          <span class="nav-icon"><svg><use href="#i-shirt"/></svg></span><span data-i18n="nav.orders">Pedidos</span>
          <span class="nav-badge" id="navOrdersBadge" hidden></span>
        </button>
        <button class="nav-item" data-view="clientes" type="button">
          <span class="nav-icon"><svg><use href="#i-users"/></svg></span><span data-i18n="nav.clients">Clientes</span>
        </button>
        <button class="nav-item" data-view="agenda" type="button">
          <span class="nav-icon"><svg><use href="#i-calendar"/></svg></span><span data-i18n="nav.agenda">Agenda</span>
          <span class="nav-badge" id="navAgendaBadge" hidden></span>
        </button>
        <button class="nav-item" data-view="insumos" type="button">
          <span class="nav-icon"><svg><use href="#i-scissors"/></svg></span><span data-i18n="nav.supplies">Insumos</span>
          <span class="nav-badge" id="navSuppliesBadge" hidden></span>
        </button>
        <button class="nav-item" data-view="ajustes" type="button">
          <span class="nav-icon"><svg><use href="#i-settings"/></svg></span><span data-i18n="nav.settings">Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-session" id="sidebarSessionCard">
          <div class="sidebar-session-info">
            <span class="sidebar-session-mode" id="sidebarSessionMode">Sesión activa</span>
            <span class="sidebar-session-user" id="sidebarSessionUser">Taller local</span>
          </div>
          <button class="sidebar-logout-btn" id="sidebarLogoutBtn" type="button" data-action="sidebar-logout" title="Cerrar sesión">
            <span class="nav-icon"><svg><use href="#i-logout"/></svg></span>
            <span class="sidebar-logout-label">Cerrar sesión</span>
          </button>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">
          <span class="nav-icon"><svg id="themeIcon"><use href="#i-moon"/></svg></span>
          <span id="themeLabel">Modo oscuro</span>
        </button>
        <div class="sidebar-note">
          <svg class="mini"><use href="#i-database"/></svg>
          <span id="sidebarLocalNote" data-i18n="sidebar.localNote">Datos guardados en este equipo</span>
        </div>
        <div class="version" id="appVersion">v0.1.0</div>
      </div>
    </aside>

    <main class="main">
      <div class="main-scroll" id="viewRoot" tabindex="-1"></div>
    </main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <dialog id="confirm" class="modal confirm"></dialog>
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>
  <div id="printRoot" class="print-root"></div>

  <script src="js/i18n.js"></script>
  <script src="js/garments.js"></script>
  <script type="module" src="js/firebase-bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
