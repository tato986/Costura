[package]
name = "costura"
version = "0.1.0"
edition = "2021"
description = "Gestor local de taller de costura"
authors = ["Costura"]

[build-dependencies]
tauri-build = "2.6.2"

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
anyhow = "1"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rust_xlsxwriter = "0.79"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
